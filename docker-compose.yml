services:
  # ── Redpanda (Kafka-compatible broker) ────────────────────
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.1
    container_name: redpanda
    command:
      - redpanda start
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
      - "9644:9644"
    networks:
      - redpanda-net
    healthcheck:
      test: [ "CMD", "rpk", "cluster", "health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MongoDB ───────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - redpanda-net
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redpanda Connect: 1 container duy nhất ────────────────
  # Chạy pipeline nào thì đổi tên file yaml ở dòng command bên dưới
  # Mặc định: 00-master-pipeline.yaml (cover tất cả use-case)
  connect:
    image: docker.redpanda.com/redpandadata/connect:4
    container_name: connect
    volumes:
      - ./redpanda-connect/pipelines:/pipelines
    command: run /pipelines/00-master-pipeline.yaml
    restart: unless-stopped
    networks:
      - redpanda-net
    depends_on:
      redpanda:
        condition: service_healthy
      mongo:
        condition: service_healthy

  # ── Redpanda Console (Giao diện Web UI) ────────────────────
  console:
    image: docker.redpanda.com/redpandadata/console:v2.8.0
    container_name: redpanda-console
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092
    networks:
      - redpanda-net
    depends_on:
      redpanda:
        condition: service_healthy

networks:
  redpanda-net:
    driver: bridge

volumes:
  mongo_data:
