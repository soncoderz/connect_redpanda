# ============================================================
# PIPELINE 10: Tối ưu hiệu năng (Batch) + Thử lại khi lỗi (Retry)
# Use-case: Dùng cho Production có hàng triệu tin nhắn. Xử lý gom nhóm để giảm tải DB.
# ============================================================

input:
  kafka:
    addresses:
      - redpanda:9092
    topics:
      - high-volume-events
    consumer_group: connect-10-batch-retry-group
    start_from_oldest: true
    # Batching: Tính năng gom nhiều tin nhắn thành cục rồi mới nhả ra 1 lần
    fetch_min_bytes: 1024          # Chờ Kafka gom đủ ít nhất 1KB dữ liệu...
    fetch_max_wait: 500ms          # ...hoặc chờ tối đa 500 mili-giây thì nhả ra

pipeline:
  # Xử lý song song 4 luồng (Giúp đẩy nhanh tốc độ)
  threads: 4    
  processors:
    - mapping: |
        root = this
        root.savedAt = now()
        root.source  = "redpanda-connect"

output:
  # fallback: Xử lý dự phòng nếu thao tác chính bị lỗi
  fallback:
    # Hành động chính: Lưu vào MongoDB
    - retry:
        max_retries: 5             # Thử lại tối đa 5 lần nếu MongoDB bị sập hoặc quá tải
        backoff:
          initial_interval: 1s     # Lần 1: Chờ 1 giây rồi thử lại
          max_interval: 30s        # Lần n: Chờ tối đa 30 giây rồi thử lại
          multiplier: 2            # Mỗi lần thử lại thì thời gian chờ tăng gấp đôi (1s, 2s, 4s, 8s)
        output:
          mongodb:
            url: mongodb://host.docker.internal:27017
            database: app_db
            collection: high_volume_events
            operation: insert-one
            document_map: |
              root = this

    # Hành động dự phòng: Nếu thử lại 5 lần mà vẫn lỗi thì in ra màn hình
    - stdout:
        codec: lines    # In nguyên văn chuỗi lỗi ra Terminal (hoặc file log)
