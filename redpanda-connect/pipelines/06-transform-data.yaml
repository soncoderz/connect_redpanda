# ============================================================
# PIPELINE 06: Transform (Biến đổi) dữ liệu trước khi lưu MongoDB
# Use-case: Đổi tên trường, xóa bớt trường nhạy cảm (như mật khẩu)
# ============================================================

input:
  kafka:
    addresses:
      - redpanda:9092
    topics:
      - raw-events
    consumer_group: connect-06-transform-group
    start_from_oldest: true

pipeline:
  processors:
    - mapping: |
        # --- Transform dữ liệu (Biến đổi JSON) ---

        # Đổi tên trường: Lấy giá trị của 'userName' gán cho trường mới tên là 'name'
        root.name = this.userName

        # Đổi tên trường: 'userEmail' gán cho 'email'
        root.email = this.userEmail

        # Giữ nguyên các trường cần thiết (phải gán lại thủ công nếu không copy nguyên văn 'root = this')
        root.id     = this.id
        root.status = this.status

        # Bằng cách không map các trường khác, chúng sẽ tự động bị XÓA BỎ 
        # (Ví dụ JSON ban đầu gửi lên có 'password', 'internalCode', sẽ bị mất)

        # Thêm các trường metadata bổ sung
        root.savedAt = now()
        root.source = "redpanda-connect"
        root.pipeline = "transform-v1"

output:
  mongodb:
    url: mongodb://host.docker.internal:27017
    database: app_db
    collection: transformed_events  # Lưu bảng riêng để dễ xem kết quả
    operation: insert-one
    document_map: |
      root = this
