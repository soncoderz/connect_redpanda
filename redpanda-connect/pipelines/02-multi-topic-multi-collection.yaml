# ============================================================
# PIPELINE 02: Đọc NHIỀU topic → lưu vào NHIỀU collection
# Use-case: Rẽ nhánh dữ liệu cơ bản dựa trên tên topic
# ============================================================

input:
  kafka:
    addresses:
      - redpanda:9092
    # Đọc cùng lúc 3 topic khác nhau
    topics:
      - users
      - orders
      - payments
    consumer_group: connect-02-multi-topic-group
    start_from_oldest: true

pipeline:
  processors:
    # mapping: Dùng Bloblang để bổ sung thêm trường cho message
    - mapping: |
        root = this
        root.savedAt      = now()                # Lưu thời điểm xử lý
        root.source       = "redpanda-connect"   # Đánh dấu nguồn gốc
        root.kafka_topic  = @kafka_topic         # Lưu lại tên topic xuất phát

output:
  # switch: rẽ nhánh đầu ra dựa vào điều kiện (giống switch-case)
  switch:
    cases:
      # Nếu tin nhắn xuất phát từ topic 'users'
      - check: '@kafka_topic == "users"'
        output:
          mongodb:
            url: mongodb://host.docker.internal:27017
            database: app_db
            collection: users        # Ghi vào bảng 'users'
            operation: insert-one
            document_map: |
              root = this

      # Nếu tin nhắn xuất phát từ topic 'orders'
      - check: '@kafka_topic == "orders"'
        output:
          mongodb:
            url: mongodb://host.docker.internal:27017
            database: app_db
            collection: orders       # Ghi vào bảng 'orders'
            operation: insert-one
            document_map: |
              root = this

      # Nếu tin nhắn xuất phát từ topic 'payments'
      - check: '@kafka_topic == "payments"'
        output:
          mongodb:
            url: mongodb://host.docker.internal:27017
            database: app_db
            collection: payments     # Ghi vào bảng 'payments'
            operation: insert-one
            document_map: |
              root = this
