# ============================================================
# PIPELINE 11: Dynamic Routing (Xử lý 1000+ bảng tự động)
# Use-case: Kiến trúc tối thượng cho dự án lớn. 
# Chỉ 1 file duy nhất tự động bắt mọi topic và lưu vào đúng bảng tương ứng.
# ============================================================

input:
  kafka_franz:
    seed_brokers: 
      - redpanda:9092
    # Lắng nghe TẤT CẢ các topic, tự động detect topic mới
    regexp_topics_include: 
      - "^.*$" 
    # TRÁNH đọc các topic ẩn của hệ thống (như __consumer_offsets) để không bị lỗi
    regexp_topics_exclude:
      - "^_.*"
    consumer_group: connect-11-dynamic-group
    start_offset: earliest

pipeline:
  threads: 4 # Xử lý đa luồng tốc độ cao
  processors:
    - mapping: |
        root = this
        # Lưu lại metadata để tiện debug
        root._meta.savedAt = now()
        root._meta.processedBy = "pipeline-11-dynamic"

output:
  mongodb:
    url: mongodb://host.docker.internal:27017
    database: app_db
    
    # ĐIỂM QUAN TRỌNG NHẤT: Tên collection tự động lấy theo tên Kafka Topic
    # Ví dụ: event từ topic 'users' sẽ tự động lưu vào collection 'users'
    collection: ${! meta("kafka_topic") } 
    
    # Dùng update-one (upsert) thay cho insert-one để chống lỗi Duplicate Key
    operation: update-one
    upsert: true
    filter_map: |
      # Tìm bản ghi theo id gửi lên từ Node.js
      # Nếu không có id → throw lỗi để message bị reject, không ghi rác vào DB
      root._id = this.id | throw("message thiếu trường 'id', bỏ qua")
    document_map: |
      # Dùng $set để ghi đè dữ liệu, đồng thời xóa trường _meta khỏi dữ liệu kinh doanh
      root."$set" = this.without("_meta")
      root."$set"._meta = this._meta
