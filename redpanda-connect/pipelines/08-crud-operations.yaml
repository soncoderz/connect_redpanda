# ============================================================
# PIPELINE 08: Thực hiện Thêm/Sửa/Xóa (CRUD) vào MongoDB
# Use-case: Đồng bộ dữ liệu Kafka với MongoDB một cách hoàn chỉnh
# Cách dùng: Gửi JSON có dạng { eventType: "add"|"update"|"delete", ...data }
# ============================================================

input:
  kafka:
    addresses:
      - redpanda:9092
    topics:
      - crud-events     # Lắng nghe topic chung dành cho mọi sự kiện CRUD
    consumer_group: connect-08-crud-group
    start_from_oldest: true

pipeline:
  processors:
    - mapping: |
        root = this
        root.savedAt = now()
        root.source  = "redpanda-connect"

output:
  # switch: Rẽ nhánh dựa vào chữ ghi trong trường 'eventType'
  switch:
    cases:
      # Trường hợp 'add': Thêm bản ghi mới
      - check: 'this.eventType == "add"'
        output:
          mongodb:
            url: mongodb://host.docker.internal:27017
            database: app_db
            collection: resources
            operation: insert-one    # Dùng lệnh INSERT của MongoDB
            document_map: |
              root = this

      # Trường hợp 'update': Cập nhật bản ghi đã có
      - check: 'this.eventType == "update"'
        output:
          mongodb:
            url: mongodb://host.docker.internal:27017
            database: app_db
            collection: resources
            operation: update-one    # Dùng lệnh UPDATE của MongoDB
            filter_map: |
              # Bộ lọc: Dò tìm bản ghi trong MongoDB có `_id` trùng với `id` gửi lên
              root._id = this.id     
            document_map: |
              # Nội dung cập nhật: Lưu đè những gì gửi lên vào thẳng CSDL (Toán tử $set)
              root."$set" = this

      # Trường hợp 'delete': Xóa bản ghi
      - check: 'this.eventType == "delete"'
        output:
          mongodb:
            url: mongodb://host.docker.internal:27017
            database: app_db
            collection: resources
            operation: delete-one    # Dùng lệnh DELETE của MongoDB
            filter_map: |
              root._id = this.id     # Xóa bản ghi có _id tương ứng

      # Trường hợp 'upsert': Nếu có thì cập nhật, nếu chưa có thì thêm mới
      - check: 'this.eventType == "upsert"'
        output:
          mongodb:
            url: mongodb://host.docker.internal:27017
            database: app_db
            collection: resources
            operation: update-one    # Vẫn dùng UPDATE
            upsert: true             # Kích hoạt chế độ Upsert (Tạo mới nếu không tìm thấy)
            filter_map: |
              root._id = this.id
            document_map: |
              root."$set" = this
