# ============================================================
# PIPELINE 12: Dynamic Full CRUD (Thêm / Sửa / Xóa / Patch)
# Use-case: Xử lý TẤT CẢ thao tác CRUD cho mọi bảng tự động.
# Tên bảng lấy từ tên topic, loại thao tác lấy từ eventType.
# ============================================================

input:
  kafka_franz:
    seed_brokers: 
      - redpanda:9092
    # Lắng nghe TẤT CẢ các topic tự động bằng Regex
    regexp_topics_include: 
      - "^.*$" 
    # Loại bỏ các topic ẩn của hệ thống Kafka (bắt đầu bằng _)
    regexp_topics_exclude:
      - "^_.*"
    consumer_group: connect-12-full-crud-group
    start_offset: earliest

pipeline:
  threads: 1  # 1 luồng = đảm bảo thứ tự (add trước update, update trước delete)
  processors:
    - mapping: |
        # 1. 'root = this': Giữ nguyên toàn bộ nội dung event gửi từ Node.js
        root = this
        
        # 2. Tạo object '_meta' ẩn để lưu vết (audit log)
        # Ghi nhận thời gian tin nhắn chạy qua Pipeline này
        root._meta.savedAt = now()
        
        # Đóng dấu mộc tên của Pipeline xử lý
        root._meta.processedBy = "pipeline-12-full-crud"
        
        # Hàm meta("kafka_topic") tự động chui vào sâu trong gói tin Kafka 
        # để móc ra tên topic gốc và lưu vào thuộc tính '_meta.topic'
        root._meta.topic = meta("kafka_topic")

output:
  switch:
    cases:
      # ─── THÊM MỚI (POST) ────────────────────────────────────────────────
      # eventType == "add": Tạo mới bản ghi, nếu đã tồn tại thì ghi đè (upsert)
      - check: 'this.eventType == "add"'
        output:
          mongodb:
            url: mongodb://host.docker.internal:27017
            database: app_db
            collection: ${! meta("kafka_topic") }
            operation: update-one
            upsert: true            # Chưa có → tạo mới, có rồi → ghi đè
            filter_map: |
              root._id = this.id | throw("add: thiếu 'id'")
            document_map: |
              root."$set" = this.without("_meta")
              root."$set"._meta = this._meta

      # ─── CẬP NHẬT TOÀN BỘ (PUT) ─────────────────────────────────────────
      # eventType == "update": Ghi đè toàn bộ document (giữ nguyên _id)
      - check: 'this.eventType == "update"'
        output:
          mongodb:
            url: mongodb://host.docker.internal:27017
            database: app_db
            collection: ${! meta("kafka_topic") }
            operation: update-one
            upsert: true            # Nếu bản ghi đã bị xóa trước đó → tạo lại
            filter_map: |
              root._id = this.id | throw("update: thiếu 'id'")
            document_map: |
              root."$set" = this.without("_meta")
              root."$set"._meta = this._meta

      # ─── CẬP NHẬT MỘT PHẦN (PATCH) ─────────────────────────────────────
      # eventType == "patch": Chỉ cập nhật những trường được gửi lên, 
      # không ghi đè các trường cũ mà Node.js không gửi.
      # Ví dụ: chỉ gửi { phone: "0909..." } thì chỉ đổi phone, giữ nguyên name.
      - check: 'this.eventType == "patch"'
        output:
          mongodb:
            url: mongodb://host.docker.internal:27017
            database: app_db
            collection: ${! meta("kafka_topic") }
            operation: update-one
            upsert: false           # KHÔNG tạo mới nếu không tồn tại (patch phải có sẵn)
            filter_map: |
              root._id = this.id | throw("patch: thiếu 'id'")
            document_map: |
              # $set chỉ ghi đè các trường có mặt, giữ nguyên các trường khác
              root."$set" = this.without("id", "eventType", "eventTime", "_meta")
              root."$set"._meta = this._meta

      # ─── XÓA (DELETE) ───────────────────────────────────────────────────
      # eventType == "delete": Xóa hẳn bản ghi khỏi MongoDB
      - check: 'this.eventType == "delete"'
        output:
          mongodb:
            url: mongodb://host.docker.internal:27017
            database: app_db
            collection: ${! meta("kafka_topic") }
            operation: delete-one
            filter_map: |
              root._id = this.id | throw("delete: thiếu 'id'")

      # ─── FALLBACK: Event không rõ loại ──────────────────────────────────
      # Nếu eventType không phải add/update/patch/delete → in ra log để debug
      - output:
          stdout: {}
