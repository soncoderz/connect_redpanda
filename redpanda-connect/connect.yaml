# ============================================================
# Redpanda Connect pipeline: Đọc topic appointment-events -> ghi vào MongoDB
# File này cấu hình luồng xử lý (pipeline) cơ bản nhất của Redpanda Connect
# ============================================================

input:
  # Xác định nguồn dữ liệu đầu vào là Kafka (hoặc Redpanda)
  kafka:
    # Địa chỉ của Kafka/Redpanda broker (lấy từ docker-compose)
    addresses:
      - redpanda:9092
    # Danh sách các topic cần lắng nghe
    topics:
      - appointment-events
    # Tên của consumer group để theo dõi offset (tránh đọc trùng lặp)
    consumer_group: connect-mongodb-sink-group
    # Bắt đầu đọc từ tin nhắn cũ nhất nếu chưa có offset
    start_from_oldest: true

pipeline:
  # Các bộ xử lý (processors) để biến đổi dữ liệu trước khi lưu
  processors:
    # mapping: Sử dụng ngôn ngữ Bloblang để biến đổi dữ liệu (tương tự như map trong JS)
    - mapping: |
        # Lưu toàn bộ nội dung tin nhắn hiện tại vào biến 'msg'
        let msg = this

        # Tạo một tài liệu (document) JSON mới ('root') để xuất ra
        # Gán _id của MongoDB bằng trường 'id' của tin nhắn gốc
        root._id = $msg.id
        # Ánh xạ các trường dữ liệu từ tin nhắn cũ sang tin nhắn mới
        root.patientName = $msg.patientName
        root.doctorName = $msg.doctorName
        root.status = $msg.status
        root.amount = $msg.amount
        root.eventTime = $msg.eventTime

        # Trích xuất metadata (siêu dữ liệu) từ Kafka và gán vào trường 'kafka'
        root.kafka.topic = @kafka_topic             # Tên topic
        root.kafka.partition = @kafka_partition     # Phân vùng (partition)
        root.kafka.offset = @kafka_offset           # Vị trí tin nhắn (offset)

        # Tạo thêm một trường 'createdAt' lưu thời gian hiện tại
        root.createdAt = now()

output:
  # Xác định đích đến của dữ liệu là MongoDB
  mongodb:
    # URL kết nối tới MongoDB (chỉ ra localhost bên ngoài Docker)
    url: mongodb://host.docker.internal:27017
    # Tên cơ sở dữ liệu
    database: app_db
    # Tên bảng (collection)
    collection: appointments
    # Thao tác: 'insert-one' nghĩa là chèn từng bản ghi mới vào
    operation: insert-one
    # Ánh xạ dữ liệu để chèn: 'root = this' nghĩa là lấy toàn bộ dữ liệu đã biến đổi ở bước pipeline bên trên
    document_map: |
      root = this
